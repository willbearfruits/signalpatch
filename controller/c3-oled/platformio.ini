; SignalPatch C3 handheld controller (docs/CONTROLLER.md in the SignalPatch repo).
;   pio run -e c3              build the firmware
;   pio run -e c3 -t upload    flash it over USB
;   pio test -e native         run the host unit tests

[platformio]
default_envs = c3

[env]
build_unflags = -std=gnu++11
build_flags = -std=gnu++17

[env:c3]
platform = espressif32@6.13.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    ; NimBLE as a peripheral only, one connection at a time
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
build_src_flags = -Wall -Wextra -Wshadow
lib_deps =
    h2zero/NimBLE-Arduino@2.5.1
    olikraus/U8g2@2.36.18
test_ignore = *

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<core/>
build_src_flags = -Wall -Wextra -Wshadow -Werror
